# /etc/wireguard/wg0.conf  —  CLIENT (RHEL VM "client-vm", LAN IP 192.168.10.129)
# Template: replace the placeholders with your own keys.
# Never commit a real private key to Git.

[Interface]
Address    = 10.0.0.2/24
PrivateKey = <CLIENT_PRIVATE_KEY>

[Peer]
# server (LAN IP 192.168.10.128)
PublicKey           = <SERVER_PUBLIC_KEY>
Endpoint            = 192.168.10.128:51820
AllowedIPs          = 10.0.0.0/24
PersistentKeepalive = 25
