# /etc/wireguard/wg0.conf  —  SERVER (RHEL VM, LAN IP 192.168.10.128)
# Template: replace the placeholders with your own keys.
# Never commit a real private key to Git.

[Interface]
Address    = 10.0.0.1/24
ListenPort = 51820
PrivateKey = <SERVER_PRIVATE_KEY>

[Peer]
# client-vm (LAN IP 192.168.10.129)
PublicKey  = <CLIENT_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32
